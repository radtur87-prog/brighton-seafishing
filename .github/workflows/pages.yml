# Tests the app and publishes the web build to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/<repo>/
name: Test and publish web app

on:
  push:
    branches: [main, claude/analysis-report-9ntn2s]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npx jest --ci

      - name: Build web app for GitHub Pages
        run: |
          EXPO_BASE_URL="$BASE_PATH" npx expo export --platform web
          # Pages has no SPA rewrites: serve the app for every unknown path.
          cp dist/index.html dist/404.html
          # Keep the _expo folder (Jekyll would drop folders starting with "_").
          touch dist/.nojekyll

      - name: Browser tests against the Pages build
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
